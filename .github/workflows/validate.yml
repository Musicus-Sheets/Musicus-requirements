name: Validate requirements
# Runs only for pull requests (not on every push). Make it a merge gate by
# marking the job "validate" as a required status check in the branch
# protection rule / ruleset of the target branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Path and label checks need the main repository and are skipped here;
      # they run locally inside docs/requirements of the main repository.
      - run: uv run tools/validate.py --check
